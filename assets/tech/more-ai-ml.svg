<g transform="translate(602,4)" style="animation:pulse 5s infinite 0.6s"><rect width="204" height="48" rx="12" fill="#0B1325" stroke="#22E4FF" stroke-opacity=".7" stroke-width="2"/><circle cx="18" cy="24" r="4" fill="#22E4FF" filter="url(#glow)"/><text x="32" y="32" font-size="21" font-weight="600" fill="#EAF2FF">OpenAI API</text></g>
<g transform="translate(150,66)" style="animation:pulse 5s infinite 0.9s"><rect width="268" height="48" rx="12" fill="#0B1325" stroke="#22E4FF" stroke-opacity=".7" stroke-width="2"/><circle cx="18" cy="24" r="4" fill="#22E4FF" filter="url(#glow)"/><text x="32" y="32" font-size="21" font-weight="600" fill="#EAF2FF">Albumentations</text></g>
<g transform="translate(432,66)" style="animation:pulse 5s infinite 1.2s"><rect width="300" height="48" rx="12" fill="#0B1325" stroke="#22E4FF" stroke-opacity=".7" stroke-width="2"/><circle cx="18" cy="24" r="4" fill="#22E4FF" filter="url(#glow)"/><text x="32" y="32" font-size="21" font-weight="600" fill="#EAF2FF">Weights &amp; Biases</text></g>
