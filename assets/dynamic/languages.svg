<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Most used languages: Jupyter Notebook 36.0%, Dart 25.6%, Python 15.8%, TypeScript 8.5%, JavaScript 4.0%, Other 10.1%">
