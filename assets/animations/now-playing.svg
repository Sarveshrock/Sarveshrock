<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-label="Now playing: Building the Future (visual only, no audio)">
<title>Now playing: Building the Future (visual only, no audio)</title>
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E4FF"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
</defs>
<style>
text{font-family:'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

</style>
<rect x="1" y="1" width="438" height="328" rx="18" fill="rgba(15,25,45,0.85)" stroke="#FF2BD6" stroke-opacity=".55" stroke-width="2"/><rect x="1" y="1" width="438" height="6" rx="3" fill="#FF2BD6" opacity=".8"/>
<text class="m" x="28" y="52" font-size="19" letter-spacing="3" fill="#FF2BD6">NOW PLAYING</text>
<text x="28" y="130" font-size="33" font-weight="800" fill="#EAF2FF">Building the Future</text>
<text class="m" x="28" y="162" font-size="16" fill="#8FA3BF">sarveshrock // ai-world.ost</text>
<rect x="28" y="200" width="384" height="8" rx="4" fill="#05070D" stroke="#FF2BD6" stroke-opacity=".4"/>
<rect x="28" y="200" width="0" height="8" rx="4" fill="url(#neon)"><animate attributeName="width" from="0" to="384" dur="24s" repeatCount="indefinite"/></rect>
<text x="150.0" y="276" font-size="34" fill="#8FA3BF" text-anchor="middle">◀</text>
<text x="220.0" y="276" font-size="34" fill="#EAF2FF" text-anchor="middle">❚❚</text>
<text x="290.0" y="276" font-size="34" fill="#8FA3BF" text-anchor="middle">▶</text>
</svg>