<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" role="img" aria-label="GitHub">
<title>GitHub</title>
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E4FF"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
</defs>
<style>
text{font-family:'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

</style>
<rect x="1" y="1" width="198" height="62" rx="14" fill="rgba(15,25,45,.9)" stroke="#22E4FF" stroke-width="2"/>
<text x="26" y="42" font-size="24" fill="#22E4FF" filter="url(#glow)">⌥</text>
<text x="62" y="41" font-size="21" font-weight="700" letter-spacing="1" fill="#EAF2FF">GitHub</text>
</svg>