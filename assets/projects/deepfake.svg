<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190" role="img" aria-label="Deepfake Video Detection System — COMPUTER VISION. Hybrid CNN-RNN spatial-temporal detector with MTCNN preprocessing.">
<title>Deepfake Video Detection System — COMPUTER VISION. Hybrid CNN-RNN spatial-temporal detector with MTCNN preprocessing.</title>
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E4FF"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
</defs>
<style>
text{font-family:'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

</style>
<rect x="1" y="1" width="598" height="188" rx="14" fill="#0B1325" stroke="#22E4FF" stroke-opacity=".6" stroke-width="2"/>
<text x="34" y="52" font-size="30" fill="#22E4FF" filter="url(#glow)">◈</text>
<text x="76" y="48" font-size="23" font-weight="700" fill="#22E4FF">Deepfake Video Detection System</text>
<text x="30" y="98" font-size="18" fill="#8FA3BF">Hybrid CNN-RNN spatial-temporal detector with MTCNN</text>
<text x="30" y="122" font-size="18" fill="#8FA3BF">preprocessing.</text>
<rect x="30" y="140" width="59" height="28" rx="14" fill="#05070D" stroke="#22E4FF" stroke-opacity=".5"/><text class="m" x="43" y="159" font-size="14" fill="#EAF2FF">CNN</text>
<rect x="97" y="140" width="70" height="28" rx="14" fill="#05070D" stroke="#22E4FF" stroke-opacity=".5"/><text class="m" x="110" y="159" font-size="14" fill="#EAF2FF">LSTM</text>
<rect x="175" y="140" width="147" height="28" rx="14" fill="#05070D" stroke="#22E4FF" stroke-opacity=".5"/><text class="m" x="188" y="159" font-size="14" fill="#EAF2FF">Transformer</text>
<text class="m" x="576" y="176" font-size="11" letter-spacing="1" fill="#8FA3BF" text-anchor="end">SOURCE: RESUME · NO PUBLIC REPO</text>
